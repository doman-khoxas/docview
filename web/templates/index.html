<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocView Web</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 20px 32px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
        }
        header .badge {
            font-size: 11px;
            background: #238636;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .container { max-width: 800px; width: 100%; padding: 40px 24px; }

        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 60px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.05);
        }
        .drop-zone h2 { font-size: 18px; margin-bottom: 8px; color: #f0f6fc; }
        .drop-zone p { font-size: 14px; color: #8b949e; }
        .drop-zone input { display: none; }

        .doc-list {
            margin-top: 32px;
        }
        .doc-list h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 12px;
        }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .doc-item:hover { border-color: #58a6ff; }
        .doc-item .info { display: flex; flex-direction: column; gap: 2px; }
        .doc-item .name { font-size: 14px; color: #f0f6fc; }
        .doc-item .meta { font-size: 12px; color: #8b949e; }
        .doc-item .actions { display: flex; gap: 8px; }
        .btn {
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover { background: #30363d; }
        .btn-primary { background: #238636; border-color: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { color: #f85149; }
        .btn-danger:hover { background: #da3633; color: #fff; border-color: #da3633; }

        .uploading {
            color: #58a6ff;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>DocView Web</h1>
        <span class="badge">v2.2.0</span>
    </header>
    <div class="container">
        <div class="drop-zone" id="dropZone">
            <h2>Upload PDF</h2>
            <p>Drag and drop a PDF here, or click to browse</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        <div class="uploading" id="uploading">Uploading...</div>

        <div class="doc-list" id="docList">
            <h3>Open Documents</h3>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const uploading = document.getElementById("uploading");
        const docList = document.getElementById("docList");

        dropZone.addEventListener("click", () => fileInput.click());
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener("change", () => {
            if (fileInput.files.length) uploadFile(fileInput.files[0]);
        });

        async function uploadFile(file) {
            uploading.style.display = "block";
            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch("/api/upload", { method: "POST", body: form });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = `/viewer/${data.id}`;
                } else {
                    alert(data.error || "Upload failed");
                }
            } catch (err) {
                alert("Upload failed: " + err.message);
            } finally {
                uploading.style.display = "none";
            }
        }

        async function loadDocuments() {
            try {
                const res = await fetch("/api/documents");
                const docs = await res.json();
                renderDocList(docs);
            } catch { /* server not ready */ }
        }

        function renderDocList(docs) {
            const items = docs.map(d => `
                <div class="doc-item">
                    <div class="info">
                        <span class="name">${escHtml(d.filename)}</span>
                        <span class="meta">${d.pages} page${d.pages !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="window.location='/viewer/${d.id}'">Open</button>
                        <button class="btn btn-danger" onclick="closeDoc('${d.id}')">Close</button>
                    </div>
                </div>
            `).join("");
            docList.innerHTML = `<h3>Open Documents</h3>${items || '<p style="font-size:13px;color:#8b949e">No documents open</p>'}`;
        }

        async function closeDoc(id) {
            await fetch(`/api/documents/${id}`, { method: "DELETE" });
            loadDocuments();
        }

        function escHtml(s) {
            const d = document.createElement("div");
            d.textContent = s;
            return d.innerHTML;
        }

        loadDocuments();
    </script>
</body>
</html>
